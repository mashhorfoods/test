<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Pixora — content dashboard</title>

<!-- THIS PAGE IS NOT PART OF THE SITE, and that is the security design rather
     than an oversight.

     It is absent from `SHIP` in tools/build-zip.js, so it is never in the
     upload archive and never reaches the live host. It is absent from
     site.config.json's page list, so nothing builds it into dist/, it is not
     in the sitemap, and no page links to it. tools/qa.js §33 fails the build
     if any of that stops being true.

     Where it runs: the review surface — GitHub Pages — which docs/44 §1
     already distinguishes from the live host. That surface has no .htaccess,
     so the site's Content-Security-Policy is neither loosened nor consulted:
     the page that needs to reach api.github.com is simply not on the host
     whose policy forbids it. docs/120 §4.1.

     Being publicly readable is not a risk. It is a client for an API that
     does nothing without a token, and the token never leaves the browser it
     was pasted into. docs/120 §5 is the honest account of that. -->

<link rel="icon" href="./src/assets/brand/logo.svg" type="image/svg+xml" />
<link rel="stylesheet" href="./src/styles/02-tokens.css" />
<style>
  /* Deliberately its own stylesheet rather than the site's. This is a tool,
     not a page of the product: it should not inherit the site's reveal
     animations, its section rhythm or its type scale, and it must not be able
     to break them either. The TOKENS are shared, so it looks like the same
     studio made it. */
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    padding: var(--space-24, 1.5rem);
    background: var(--color-bg, #141414);
    color: var(--color-text-primary, #f2f2f2);
    font-family: var(--font-body, system-ui, sans-serif);
    font-size: 1rem;
    line-height: 1.5;
    max-inline-size: 56rem;
    margin-inline: auto;
  }
  h1 { font-family: var(--font-display, inherit); font-size: 1.5rem; margin: 0 0 .25rem; }
  h2 { font-size: 1.2rem; margin: 0 0 .75rem; }
  h3 { font-size: 1rem; margin: 0 0 .5rem; }
  h4 { font-size: .95rem; margin: 0 0 .5rem; color: var(--color-text-secondary, #b9b9b9); }
  a { color: var(--color-accent, #f4d13f); }

  /* The explanation is orientation, not reference. It earns its space on the
     sign-in screen, where somebody may be here for the first time; once you
     are signed in and editing, it is 150px of a phone screen restating what
     the page in front of you obviously is. `body:has()` keeps that decision
     in CSS rather than making the script manage it. */
  .a-head { border-block-end: 1px solid var(--color-border, #2e2e2e); padding-block-end: 1rem; margin-block-end: 1.5rem; }
  .a-head p { color: var(--color-text-secondary, #b9b9b9); margin: 0; font-size: .9rem; }
  body:has(.a-bar) .a-head { padding-block-end: .5rem; margin-block-end: 1rem; }
  body:has(.a-bar) .a-head p { display: none; }
  body:has(.a-bar) h1 { font-size: 1.1rem; }

  /* An empty bar takes no space and draws no line. */
  .a-commit--idle { display: none; }

  .a-status { min-block-size: 1.5rem; font-size: .9rem; color: var(--color-text-secondary, #b9b9b9); }
  .a-status.is-error { color: #ff9a9a; }

  .a-signin { display: grid; gap: .75rem; max-inline-size: 32rem; }
  .a-check { display: flex; gap: .5rem; align-items: start; font-size: .85rem; color: var(--color-text-secondary, #b9b9b9); }

  .a-bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-block-end: 1rem; }
  .a-bar__who { font-size: .9rem; color: var(--color-text-secondary, #b9b9b9); }

  .a-tabs { display: flex; gap: .5rem; flex-wrap: wrap; margin-block-end: 1.5rem; }
  .a-tab {
    min-block-size: 44px; padding-inline: 1rem;
    background: transparent; color: inherit;
    border: 1px solid var(--color-border, #2e2e2e); border-radius: var(--radius-md, 8px);
    font: inherit; cursor: pointer;
  }
  .a-tab.is-active { border-color: var(--color-accent, #f4d13f); color: var(--color-accent, #f4d13f); }

  /* A collapsed category is one row; the page opens in a screen rather than
     ten. See the note in admin.js above renderPricing(). */
  .a-group { margin-block-end: 1rem; border: 1px solid var(--color-border, #2e2e2e); border-radius: var(--radius-md, 8px); }
  .a-group__title {
    color: var(--color-accent, #f4d13f); cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; gap: 1rem;
    min-block-size: 56px; padding: .5rem 1rem; margin: 0;
    list-style: none;
  }
  .a-group__title::-webkit-details-marker { display: none; }
  /* A caret drawn in CSS rather than an icon file: this page ships no assets
     of its own, and a disclosure needs to LOOK like one before it is tapped. */
  .a-group__title::after {
    content: ""; inline-size: .55rem; block-size: .55rem; flex: 0 0 auto;
    border-inline-end: 2px solid currentColor; border-block-end: 2px solid currentColor;
    rotate: 45deg; margin-inline-start: .25rem;
    transition: rotate var(--duration-fast, 150ms) ease;
  }
  .a-group[open] > .a-group__title::after { rotate: -135deg; }
  .a-group__count { font-size: .8rem; color: var(--color-text-secondary, #b9b9b9); margin-inline-start: auto; }
  .a-group > .a-card:first-of-type { margin-block-start: 0; }
  .a-group > .a-card { margin-inline: 1rem; }
  .a-group > .a-card:last-child { margin-block-end: 1rem; }
  .a-card {
    border: 1px solid var(--color-border, #2e2e2e); border-radius: var(--radius-md, 8px);
    padding: 1rem; margin-block-end: 1rem; display: grid; gap: .75rem;
  }
  .a-field { display: grid; gap: .25rem; }
  .a-field__label { font-size: .8rem; color: var(--color-text-secondary, #b9b9b9); }
  .a-field__help { font-size: .75rem; color: var(--color-text-secondary, #b9b9b9); }
  .a-field__error { font-size: .8rem; color: #ff9a9a; }
  /* Focusing a field near the foot of the page must not put it under the
     sticky bar. Roughly the bar's height, plus air. */
  .a-field__input { scroll-margin-block-end: 9rem; }
  .a-field__input, .a-search {
    min-block-size: 44px; padding: .5rem .75rem; inline-size: 100%;
    background: var(--color-bg-sunken, #0f0f0f); color: inherit;
    border: 1px solid var(--color-border, #2e2e2e); border-radius: var(--radius-md, 8px);
    font: inherit;
  }
  .a-field__input.is-invalid { border-color: #ff9a9a; }
  .a-field__input:focus-visible, .a-search:focus-visible, .a-tab:focus-visible, .a-btn:focus-visible {
    outline: 2px solid var(--color-accent, #f4d13f); outline-offset: 2px;
  }
  .a-list { display: grid; gap: .75rem; margin-block-start: 1rem; }

  /* The operational views: a key/value line and a scope list. Same tokens as
     everything else here — this is a new screen, not a new design. */
  .a-kv { display: flex; gap: .75rem; margin: .35rem 0; font-size: .9375rem; line-height: 1.5; }
  .a-kv__k { flex: 0 0 8.5rem; color: var(--color-text-muted, #8a8a8a); }
  .a-kv__v { flex: 1 1 auto; min-inline-size: 0; overflow-wrap: anywhere; }
  .a-list__item {
    padding: .5rem .75rem; border: 1px solid var(--color-border, #2e2e2e);
    border-radius: var(--radius-md, 8px); font-size: .875rem; line-height: 1.5;
    overflow-wrap: anywhere;
  }
  .a-list__item--sub { margin-inline-start: 1rem; border-style: dashed; color: var(--color-text-secondary, #b9b9b9); }
  @media (max-width: 34em) {
    .a-kv { display: block; }
    .a-kv__k { display: block; flex: none; font-size: .8125rem; }
    .a-list__item--sub { margin-inline-start: .5rem; }
  }

  .a-btn {
    min-block-size: 44px; padding-inline: 1.25rem;
    border-radius: var(--radius-md, 8px); border: 1px solid transparent;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  .a-btn--primary { background: var(--color-accent, #f4d13f); color: #141414; }
  .a-btn--primary:disabled { background: transparent; color: var(--color-text-disabled, #6b6b6b); border-color: var(--color-border, #2e2e2e); cursor: not-allowed; }
  .a-btn--ghost { background: transparent; color: inherit; border-color: var(--color-border, #2e2e2e); }

  /* STICKY, so "can I save this yet" is answerable without scrolling. The
     bar was at the foot of a 7,000px page — 10.4 screens down on an
     iPhone SE. `bottom: 0` sticky is supported on every browser in the
     support floor (docs/59). */
  .a-commit {
    display: grid; gap: .75rem;
    position: sticky; inset-block-end: 0; z-index: 2;
    border-block-start: 1px solid var(--color-border, #2e2e2e);
    padding-block: .75rem;
    /* The page background, opaque — a translucent bar over a text field is
       harder to read than either. */
    background: var(--color-bg, #141414);
    margin-block-start: 1rem;
  }
  /* The bar overlays the end of the page, so the page ends above it. */
  /* THE STICKY BAR NEEDS ITS OWN SPACE AT THE END OF THE PAGE.
     Without it the bar floats over the last field, and the message under
     that field can never be scrolled clear of it: the page is already at
     the bottom, so there is nothing left to scroll. Reserving the height
     of the bar is the fix that works at every screen size and needs no
     scrolling at all. --a-bar-h is written by admin.js after each render
     and is 0 when the bar is idle and draws nothing, so a page with
     nothing to save pays no whitespace for a control that is not there. */
  .a-body { padding-block-end: calc(1rem + var(--a-bar-h, 0px)); }
  html { scroll-padding-block-end: calc(1rem + var(--a-bar-h, 0px)); }
  .a-problems__title { color: #ff9a9a; margin: 0; font-size: .9rem; }
  .a-note { color: var(--color-text-secondary, #b9b9b9); font-size: .9rem; }
  .a-note--ok { color: var(--color-accent, #f4d13f); }
  .a-result { border: 1px solid var(--color-accent, #f4d13f); border-radius: var(--radius-md, 8px); padding: 1rem; margin-block-end: 1.5rem; display: grid; gap: .5rem; }
  .a-link { display: inline-block; min-block-size: 44px; line-height: 44px; }
</style>
</head>
<body>
  <header class="a-head">
    <h1>Content dashboard</h1>
    <p>Prices and Arabic strings. Everything is checked before it can be saved,
       and saving commits to the repository — the site then rebuilds itself.</p>
  </header>

  <div id="status" class="a-status" role="status" aria-live="polite"></div>

  <main id="app">
    <noscript>
      <p>This tool needs JavaScript. The site itself does not — only this page,
         because it talks to the GitHub API.</p>
      <p>Without it, edit <code>src/data/pricing.json</code> in GitHub's own
         web editor. That road still works and is not going away.</p>
    </noscript>
  </main>

  <script type="module" src="./src/scripts/admin.js"></script>
</body>
</html>
