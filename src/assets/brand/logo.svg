<!--
  THE LOGO — single source of truth.

  Every surface that shows the logo references THIS file:
    - the site header (index.html)
    - the browser tab / favicon (index.html, styleguide.html)
    - any future page, e-mail template or social card

  To swap in the real asset, replace this file's contents and change nothing
  else. Keep the filename. Requirements:
    - SVG, with a `viewBox` (that is what lets it scale without distorting)
    - no fixed `width`/`height` attributes on the root element
    - if the artwork is a fixed-colour brand mark, keep its own fill values;
      do not use `currentColor` unless the logo is genuinely monochrome and
      intended to follow the surrounding text colour
    - if the real logo is NOT square, update --logo-aspect in
      src/styles/components/header.css to match, so the header reserves the
      right space before the file loads

  PLACEHOLDER — generic by design. It identifies the slot without inventing a
  brand identity, and must be replaced before launch.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Agency logo placeholder">
  <title>Agency logo placeholder</title>
  <rect x="1.5" y="1.5" width="29" height="29" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
  <path d="M10 24.5 L18.4 7.5 H23 L14.6 24.5 Z" fill="#F4D13F" />
</svg>
