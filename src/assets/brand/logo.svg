<!--
  FAVICON MARK — the accent letterform from the PIXORA wordmark.

  The header uses a type lockup (see index.html / .c-brand), because a
  wordmark set in Poppins stays crisp at any density, costs no request, and
  can be restyled per breakpoint. A favicon cannot do that: at 16px a full
  wordmark is unreadable, and the browser has no access to the page's fonts.
  So this file carries the mark alone — drawn as paths, not text, so it
  renders identically everywhere.

  This is a derivation of the wordmark, not a second identity. If a designed
  brand mark exists, replace this file with it (keep the filename and the
  viewBox) and every surface that references it follows.

  Referenced by: index.html, styleguide.html  →  <link rel="icon">
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Pixora">
  <title>Pixora</title>
  <rect width="32" height="32" fill="#202020" />
  <path
    d="M8.5 7.5 23.5 24.5 M23.5 7.5 8.5 24.5"
    stroke="#F4D13F"
    stroke-width="4.2"
    stroke-linecap="square"
    fill="none"
  />
</svg>
