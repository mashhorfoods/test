<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Showpiece scene</title>
<!--
  THE SHOWPIECE SCENE — rendered to the hero film by tools/build-showpiece.js.

  NOT a page. It is a film set: 1280x720, no scrollbars, no interaction. The
  build opens it in headless Chromium, seeks frame by frame, and encodes what
  it sees. Editing this file changes the hero footage; nothing else does.

  NO TEXT, DELIBERATELY — and this is the rule most likely to be broken later.
  The first cut of this scene carried the PIXORA wordmark and four service
  cards. It looked good alone and was wrong in the hero: the headline already
  says the name, the sections already name the services, and baked-in English
  labels cannot be translated — the Arabic reader would have got an image of
  another language. Type in the hero belongs in the DOM, where it is
  selectable, translatable and readable by a screen reader. The film carries
  atmosphere only.

  DETERMINISTIC BY CONSTRUCTION. Every animation is paused and driven by one
  negative delay (--t), so frame N is identical on every run and on every
  machine. Nothing reads the clock, nothing is random: built twice from the
  same commit it is byte-identical, which is what makes the budget check mean
  something.

  DIRECTION-NEUTRAL. Motion is radial, vertical or centre-out, never a
  left-to-right sweep — this plays behind the Arabic hero as well as the
  English one, and a sweep that reads as forward in one reads as backwards in
  the other. One file, both languages. See docs/53 §5.
-->
<style>
  :root {
    --t: 0s;
    --loop: 12s;
    --charcoal-900: #0d0f12;
    --charcoal-800: #111418;
    --yellow: #f4d13f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
    background: var(--charcoal-900);
  }

  body { position: relative; }

  /* One paused timeline, shared. */
  .a {
    animation-duration: var(--loop);
    animation-iteration-count: infinite;
    animation-play-state: paused;
    animation-timing-function: ease-in-out;
    animation-fill-mode: both;
    animation-delay: var(--t);
  }

  /* A ground that is not flat black: the site's own two darkest surfaces,
     drifting vertically so the frame is never quite static. */
  .ground {
    position: absolute;
    inset: -6%;
    background:
      radial-gradient(ellipse 70% 50% at 50% 38%, var(--charcoal-800) 0%, transparent 70%),
      var(--charcoal-900);
    animation-name: drift;
  }
  @keyframes drift {
    0%, 100% { transform: translateY(0) scale(1.00); }
    50%      { transform: translateY(-14px) scale(1.03); }
  }

  /* The dot field — the site's grid, made visible and breathing. */
  .field {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,.13) 1.1px, transparent 1.1px);
    background-size: 36px 36px;
    -webkit-mask-image: radial-gradient(circle at 50% 44%, #000 0%, transparent 66%);
    mask-image: radial-gradient(circle at 50% 44%, #000 0%, transparent 66%);
    animation-name: breathe;
  }
  @keyframes breathe {
    0%, 100% { opacity: .26; transform: scale(1.000); }
    50%      { opacity: .58; transform: scale(1.045); }
  }

  /* Concentric rings, expanding from centre and fading — the orbit diagram's
     geometry as atmosphere rather than as a second diagram. Radial, so it has
     no reading direction. */
  .ring {
    position: absolute;
    left: 50%; top: 44%;
    width: 320px; height: 320px;
    translate: -50% -50%;
    border: 1px solid rgba(244, 209, 63, .34);
    border-radius: 50%;
    animation-name: expand;
  }
  .ring:nth-of-type(2) { animation-delay: calc(var(--t) + 4s); }
  .ring:nth-of-type(3) { animation-delay: calc(var(--t) + 8s); }
  @keyframes expand {
    0%   { opacity: 0;   transform: scale(.34); }
    12%  { opacity: .55; }
    100% { opacity: 0;   transform: scale(3.1); }
  }

  /* One accent bloom, centred. The only warm light in the frame. */
  .bloom {
    position: absolute;
    left: 50%; top: 44%;
    width: 980px; height: 980px;
    translate: -50% -50%;
    background: radial-gradient(circle, rgba(244,209,63,.13) 0%, transparent 60%);
    animation-name: bloom;
  }
  @keyframes bloom {
    0%, 100% { opacity: .30; transform: scale(.86); }
    50%      { opacity: .80; transform: scale(1.06); }
  }

  /* A scrim, so the hero's text sits on a predictable ground no matter which
     instant of the loop is on screen. Contrast is not left to chance. */
  .scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(13,15,18,.42) 0%, rgba(13,15,18,.16) 46%, rgba(13,15,18,.58) 100%);
  }
</style>
</head>
<body>
  <div class="ground a"></div>
  <div class="field a"></div>
  <div class="bloom a"></div>
  <div class="ring a"></div>
  <div class="ring a"></div>
  <div class="ring a"></div>
  <div class="scrim"></div>

<script>
  /* The only entry point the renderer uses. `p` is 0..1 through the loop;
     one negative delay seeks every animation to the same instant. */
  window.__seek = (p) => {
    const loop = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--loop'));
    document.documentElement.style.setProperty('--t', `${-(p * loop).toFixed(4)}s`);
    return document.fonts.ready;
  };
</script>
</body>
</html>
