<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Showpiece scene</title>
<!--
  THE SHOWPIECE SCENE — rendered to the hero film by tools/build-showpiece.js.

  NOT a page. It is a film set: 1280x720, no interaction, one canvas. The build
  opens it in headless Chromium, seeks frame by frame, and encodes what it
  sees. Editing this file changes the hero footage; nothing else does.

  WHY THIS IS DRAWN RATHER THAN FILMED. The generated footage this replaces was
  good, and it arrived with another company's watermark baked into the corner
  where the headline sits — removing which is a licence question, not an
  editing one. Drawn, the same look costs nothing per export, carries no
  licence, is sharp at any size instead of upscaled from 784px, and can be
  changed by editing numbers. See docs/54 §8.

  IT HAS AN ARGUMENT, NOT JUST AN ATMOSPHERE. The first drawn version was dust
  breathing forever, and it was missing the point of the clips it replaced:
  those two were a SEQUENCE — the ground, then the launch — which is the
  studio's whole pitch in one loop. So this one is three acts on one timeline:

    GROUND   (0.00-0.45)  the floor is lit, the grid reads, dust drifts loose
    GATHER   (0.30-0.62)  the dust converges into a column, the pool charges
    LAUNCH   (0.55-0.85)  the column surges upward and the floor gives up its
                          light — energy leaves the ground
    SETTLE   (0.85-1.00)  back to loose dust on a dim floor, which is frame 0

  The rise is VERTICAL, which is both what a launch looks like and the one
  direction that means the same thing in Arabic. The original clip B said this
  diagonally and had to be mirrored to survive RTL; upward, it needs nothing.

  DETERMINISTIC BY CONSTRUCTION, and more strictly than the CSS version was.
  Every particle's position is a FUNCTION OF TIME — nothing accumulates, no
  frame depends on the frame before it, and the only randomness is a seeded
  generator that produces the same sequence on every machine. Frame N is
  identical on every run.

  SEAMLESS BY CONSTRUCTION, not by cross-fade. Every motion is periodic with
  exactly the loop length: particles wrap a whole number of times, every sway
  and pulse is a sine of an integer multiple of t/loop. There is no seam to
  hide, because the last frame IS the frame before the first.

  DARK SIDE LEFT. The light source sits at 62% across, so the left third stays
  darkest — that is where the English headline goes. hero-film.css mirrors the
  whole thing at [dir="rtl"], which puts the dark half on the right where the
  Arabic headline goes. One file, correct in both. Get the source orientation
  backwards and it is correct in exactly one.
-->
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #0d0f12; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="stage" width="1280" height="720"></canvas>
<script>
(() => {
  const W = 1280, H = 720, LOOP = 12;
  const ctx = document.getElementById('stage').getContext('2d');

  /* The light source. Everything is composed around it, and its horizontal
     position is what keeps the left side dark. */
  const CX = W * 0.62, FLOOR = H * 0.78;

  const INK = '#0d0f12';
  const WARM = (a) => `rgba(244, 209, 63, ${a})`;
  const PALE = (a) => `rgba(255, 240, 205, ${a})`;

  /* mulberry32 — small, fast, and identical everywhere. Math.random() would
     make every build a different film and the budget check meaningless. */
  const rng = (seed) => () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

  /* Particles are built once and never mutated. Each carries the constants of
     its own orbit; `at(t)` evaluates it. `wraps` and `swayRate` are integers,
     which is the entire reason the loop is seamless: every particle is back
     where it started at t = LOOP. */
  const build = () => {
    const r = rng(20260904);
    const dust = [];
    for (let i = 0; i < 520; i += 1) {
      /* Clustered toward the shaft, with a long tail into the dark. */
      const cluster = Math.pow(r(), 1.7);
      const side = r() < 0.5 ? -1 : 1;
      dust.push({
        x: CX + side * cluster * W * 0.52 + (r() - 0.5) * 60,
        y0: r(),
        wraps: 1 + Math.floor(r() * 3),          // 1..3 rises per loop
        size: 0.45 + Math.pow(r(), 2.2) * 2.1,
        sway: 6 + r() * 26,
        swayRate: 1 + Math.floor(r() * 2),        // 1..2 sways per loop
        phase: r(),
        warm: r() < 0.72,
        /* How far this mote is drawn into the column. Uneven on purpose —
           dust that all converged equally would read as a machine. */
        drawn: 0.35 + r() * 0.65,
        alpha: 0.20 + Math.pow(r(), 1.5) * 0.75,
      });
    }
    /* A handful of out-of-focus motes, larger and dimmer, for depth. */
    const bokeh = [];
    for (let i = 0; i < 26; i += 1) {
      bokeh.push({
        x: CX + (r() - 0.5) * W * 0.95,
        y0: r(),
        wraps: 1,
        size: 5 + r() * 13,
        sway: 10 + r() * 22,
        swayRate: 1,
        phase: r(),
        drawn: 0.15 + r() * 0.3,
        alpha: 0.05 + r() * 0.10,
      });
    }
    return { dust, bokeh };
  };

  const P = build();
  const TAU = Math.PI * 2;

  /* ---- the three acts, as three functions of one phase ------------------
     Everything below takes s = t / LOOP and returns to its starting value at
     s = 1, which is what keeps the loop seamless while the film still tells a
     story rather than idling. */

  /* FLOW. Not a constant speed — the shared progress of every particle, slow
     while the dust is loose, fastest at the launch. Φ(0)=0, Φ(1)=1 exactly, so
     a particle that rises `wraps` times is back where it began at the end of
     the loop no matter how uneven its journey was.

     A < 1 keeps it monotonic: at A = 1 the dust would stall dead, and above it
     the flow would run backwards, which is the one thing a launch must not
     appear to do. */
  /* SURGE raised and SLOWEST moved so the flow's fastest instant lands exactly on
   the launch rather than three-hundredths before it — the acceleration and the
   flare were arriving separately, which is why it read as a swell instead of a
   hit. Still under 1: at 1 the dust stalls dead, above it the flow reverses. */
  const SURGE = 0.93, SLOWEST = 0.15;
  const flow = (s) => {
    const f = (u) => u - (SURGE / TAU) * Math.sin(TAU * (u - SLOWEST));
    return f(s) - f(0);
  };

  /* GATHER. Zero at both ends, peaking mid-loop: how strongly the dust is
     pulled toward the column before it goes up. */
  const gather = (s) => (1 - Math.cos(TAU * s)) / 2;

  /* LAUNCH. A narrow bump centred at 0.65 — the moment the column surges and
     the floor gives up its light. Far enough from the ends that it is already
     nothing at s = 0, so the loop is unaffected by it. */
  const launch = (s) => {
    /* Asymmetric on purpose. A symmetric bump swells and subsides and reads as
       a breath; an impact rises far faster than it falls. Narrow on the way in,
       three times wider on the way out — the difference between a flare and a
       pulse. */
    let d = s - 0.65;
    if (d > 0.5) d -= 1; else if (d < -0.5) d += 1;
    const sigma = d < 0 ? 0.042 : 0.125;
    return Math.exp(-(d * d) / (2 * sigma * sigma));
  };

  /* The sharpest elements ride this rather than L, so the flare peaks harder
     and clears faster than the light around it. */
  const punchOf = (L) => Math.pow(L, 1.7);

  /* Where a particle is at time t. It rises on the shared flow and leans
     toward the column as the gather builds; the sway is a sine rather than a
     drift, so there is no net horizontal travel and the frame mirrors cleanly.
     Nothing here reads the previous frame. */
  const at = (p, t) => {
    const s = t / LOOP;
    const u = (p.y0 - flow(s) * p.wraps) % 1;
    const y = (u < 0 ? u + 1 : u) * (H + 200) - 100;
    const pull = gather(s) * 0.55 * p.drawn;
    const x = p.x + (CX - p.x) * pull
      + Math.sin(TAU * (p.swayRate * s + p.phase)) * p.sway * (1 - pull * 0.6);
    return { x, y };
  };

  /* Fades a particle out at the top and bottom of its travel, so nothing pops
     into existence at the frame edge. */
  const edgeFade = (y) => {
    const top = Math.min(1, Math.max(0, (y + 60) / 200));
    const bottom = Math.min(1, Math.max(0, (H + 60 - y) / 220));
    return Math.min(top, bottom);
  };

  function draw(t) {
    const s = t / LOOP;
    const G = gather(s);   // the dust drawing together
    const L = launch(s);   // the surge

    /* The floor charges as the dust gathers and is spent by the launch: the
       ground gives its light up to what leaves it. That subtraction is the
       whole argument of the film in one line. */
    const K = punchOf(L);  // the sharp half of the launch
    const ground = Math.max(0, G * 0.9 - L * 1.15);
    const breath = 0.35 + 0.65 * G;

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = INK;
    ctx.fillRect(0, 0, W, H);

    /* The volume itself: a wide warm haze around the source. */
    const haze = ctx.createRadialGradient(CX, H * 0.44, 0, CX, H * 0.44, 700);
    haze.addColorStop(0, WARM(0.085 + breath * 0.05));
    haze.addColorStop(0.55, WARM(0.02));
    haze.addColorStop(1, 'rgba(244,209,63,0)');
    ctx.fillStyle = haze;
    ctx.fillRect(0, 0, W, H);

    /* The shaft. Blurred heavily — a hard-edged cone reads as a shape, and
       this has to read as light. */
    ctx.save();
    ctx.filter = 'blur(46px)';
    /* Dim while the ground still holds the light; the launch is what lifts it
       — and it brightens from the TOP down, so the eye is pulled upward. */
    const shaft = ctx.createLinearGradient(0, -40, 0, FLOOR);
    shaft.addColorStop(0, PALE(0.05 + K * 0.40 + ground * 0.03));
    shaft.addColorStop(0.62, WARM(0.025 + K * 0.13));
    shaft.addColorStop(1, WARM(0.010 + ground * 0.03));
    ctx.fillStyle = shaft;
    ctx.beginPath();
    ctx.moveTo(CX - 66, -60);
    ctx.lineTo(CX + 66, -60);
    /* Narrows as it fires: a column, not a floodlight. */
    ctx.lineTo(CX + 250 - K * 150, FLOOR);
    ctx.lineTo(CX - 250 + K * 150, FLOOR);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    /* Where the shaft lands. The brightest thing in the frame, and still far
       from bright — it sits behind a headline. */
    ctx.save();
    ctx.filter = 'blur(26px)';
    const poolW = 300 + G * 46 - K * 110;
    const pool = ctx.createRadialGradient(CX, FLOOR, 0, CX, FLOOR, poolW);
    /* Warm, not white. A white core reads as a lamp; the accent has to survive
       all the way into the brightest part of the frame or the palette breaks
       exactly where the eye lands. */
    pool.addColorStop(0, PALE(0.10 + ground * 0.26));
    pool.addColorStop(0.18, WARM(0.10 + ground * 0.34));
    pool.addColorStop(0.45, WARM(0.03 + ground * 0.10));
    pool.addColorStop(1, 'rgba(244,209,63,0)');
    ctx.fillStyle = pool;
    ctx.beginPath();
    ctx.ellipse(CX, FLOOR, poolW, poolW * 0.17, 0, 0, TAU);
    ctx.fill();
    ctx.restore();

    /* The site's grid, receding — the one structural element, kept faint
       enough to be felt rather than read. */
    ctx.save();
    /* The ground is only legible while it holds the light. After the launch it
       recedes, which is what makes the launch feel like leaving somewhere. */
    ctx.strokeStyle = `rgba(255,255,255,${(0.028 + ground * 0.055).toFixed(4)})`;
    ctx.lineWidth = 1;
    for (let i = 1; i <= 9; i += 1) {
      const y = FLOOR + Math.pow(i / 9, 2.1) * (H - FLOOR) * 1.25;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
    for (let i = -7; i <= 7; i += 1) {
      ctx.beginPath();
      ctx.moveTo(CX + i * 44, FLOOR);
      ctx.lineTo(CX + i * 300, H + 40);
      ctx.stroke();
    }
    ctx.restore();

    /* Dust. Additive, so overlapping motes build light rather than paint over
       one another — which is what makes it read as suspended in a beam. */
    ctx.globalCompositeOperation = 'lighter';

    for (const p of P.bokeh) {
      const { x, y } = at(p, t);
      const a = p.alpha * edgeFade(y) * (0.6 + breath * 0.4);
      if (a <= 0.002) continue;
      const g = ctx.createRadialGradient(x, y, 0, x, y, p.size);
      g.addColorStop(0, WARM(a));
      g.addColorStop(1, 'rgba(244,209,63,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, p.size, 0, TAU);
      ctx.fill();
    }

    for (const p of P.dust) {
      const { x, y } = at(p, t);
      /* Lit by the shaft: a mote far from the source is barely there. */
      const lit = Math.max(0, 1 - Math.abs(x - CX) / (W * 0.46));
      const a = p.alpha * edgeFade(y) * (0.28 + lit * 0.72) * (0.75 + breath * 0.25);
      if (a <= 0.004) continue;
      ctx.fillStyle = p.warm ? WARM(a) : PALE(a * 0.75);

      /* STREAKING — the thing that makes it read as a hit rather than a
         brightening. Real dust caught by a fast camera smears along its
         travel, so at the punch each mote stretches vertically in proportion
         to its own speed: the fast ones become lines, the slow ones stay
         points, and the frame gains a texture it does not have at rest. It is
         a shape change rather than another glow, which is why it survives
         behind text that must stay readable. */
      /* Nearly uniform across the frame, not concentrated at the column. The
         first attempt scaled streaking with `lit`, so only dust near the light
         smeared — and in the hero that is precisely the area the orbit diagram
         covers, which meant the loudest moment of the film happened where
         nothing could be seen. Now the whole field lifts at once and the punch
         reads in the open dark as well as behind the artwork. */
      const stretch = 1 + K * p.wraps * 7.5 * (0.78 + lit * 0.22);
      ctx.beginPath();
      if (stretch > 1.25) {
        ctx.ellipse(x, y, p.size, p.size * stretch, 0, 0, TAU);
      } else {
        ctx.arc(x, y, p.size, 0, TAU);
      }
      ctx.fill();
    }

    ctx.globalCompositeOperation = 'source-over';

    /* Vignette, then scrim. The scrim is the contrast guarantee: the hero's
       text sits on a predictable ground whatever instant is on screen, and it
       is baked in here rather than left to the CSS, so the footage is safe
       wherever it is used. */
    const vig = ctx.createRadialGradient(CX, H * 0.46, H * 0.25, CX, H * 0.46, H * 1.05);
    vig.addColorStop(0, 'rgba(13,15,18,0)');
    vig.addColorStop(1, 'rgba(13,15,18,0.62)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    const scrim = ctx.createLinearGradient(0, 0, 0, H);
    scrim.addColorStop(0, 'rgba(13,15,18,0.40)');
    scrim.addColorStop(0.46, 'rgba(13,15,18,0.12)');
    scrim.addColorStop(1, 'rgba(13,15,18,0.52)');
    ctx.fillStyle = scrim;
    ctx.fillRect(0, 0, W, H);
  }

  /* The only entry point the renderer uses. `p` is 0..1 through the loop. */
  window.__seek = (p) => {
    draw(p * LOOP);
    return Promise.resolve();
  };

  draw(0);
})();
</script>
</body>
</html>
