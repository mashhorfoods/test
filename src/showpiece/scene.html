<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Showpiece scene</title>
<!--
  THE SHOWPIECE SCENE — rendered to video by tools/build-showpiece.js.

  NOT a page. It is a film set: 1280x720, no scrollbars, no interaction. The
  build opens it in headless Chromium, seeks frame by frame, and encodes what
  it sees. Editing this file changes the hero footage; nothing else does.

  DETERMINISTIC BY CONSTRUCTION. Every animation is paused and driven by one
  negative delay (--t), so frame N is identical on every run and on every
  machine. Nothing here reads the clock, and nothing is random: a video built
  twice from the same commit is byte-identical, which is what makes the budget
  check meaningful.

  DIRECTION-NEUTRAL, deliberately. Motion is vertical, radial or centre-out,
  never a left-to-right sweep — because this footage plays behind an Arabic
  hero as well as an English one, and a sweep that reads as forward in English
  reads as backwards in Arabic. One file, both languages. See docs/53 §5.
-->
<style>
  @font-face {
    font-family: 'Poppins';
    src: url('../assets/fonts/poppins-latin-600.woff2') format('woff2');
    font-weight: 600;
    font-display: block;
  }
  @font-face {
    font-family: 'Poppins';
    src: url('../assets/fonts/poppins-latin-400.woff2') format('woff2');
    font-weight: 400;
    font-display: block;
  }

  :root {
    --t: 0s;
    --loop: 8s;
    --charcoal-900: #0d0f12;
    --charcoal-700: #16191e;
    --charcoal-600: #1e2229;
    --yellow: #f4d13f;
    --white: #ffffff;
    --muted: rgba(255, 255, 255, .48);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
    background: var(--charcoal-900);
  }

  body {
    font-family: 'Poppins', system-ui, sans-serif;
    display: grid;
    place-items: center;
    position: relative;
  }

  /* Every animated element shares one paused timeline. */
  .a {
    animation-duration: var(--loop);
    animation-iteration-count: infinite;
    animation-play-state: paused;
    animation-timing-function: cubic-bezier(.22, .61, .36, 1);
    animation-fill-mode: both;
  }

  /* ---- the ground: a dot field breathing outward from centre ---- */
  .field {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,.14) 1.1px, transparent 1.1px);
    background-size: 34px 34px;
    -webkit-mask-image: radial-gradient(circle at 50% 46%, #000 0%, transparent 62%);
    mask-image: radial-gradient(circle at 50% 46%, #000 0%, transparent 62%);
    animation-name: breathe;
    animation-delay: var(--t);
  }
  @keyframes breathe {
    0%, 100% { opacity: .30; transform: scale(1.00); }
    50%      { opacity: .62; transform: scale(1.06); }
  }

  /* A single accent bloom, centred — no direction. */
  .bloom {
    position: absolute;
    left: 50%; top: 46%;
    width: 900px; height: 900px;
    translate: -50% -50%;
    background: radial-gradient(circle, rgba(244,209,63,.16) 0%, transparent 58%);
    animation-name: bloom;
    animation-delay: var(--t);
  }
  @keyframes bloom {
    0%, 100% { opacity: .25; transform: scale(.82); }
    46%      { opacity: .85; transform: scale(1.04); }
  }

  /* ---- the lockup ---- */
  .stage { position: relative; text-align: center; z-index: 2; }

  .word {
    font-weight: 600;
    font-size: 104px;
    line-height: 1;
    color: var(--white);
    animation-name: word;
    animation-delay: var(--t);
  }
  .word span { color: var(--yellow); }
  @keyframes word {
    0%   { opacity: 0; letter-spacing: .34em; transform: translateY(14px); }
    16%  { opacity: 1; letter-spacing: .02em; transform: translateY(0); }
    84%  { opacity: 1; letter-spacing: .02em; transform: translateY(0); }
    100% { opacity: 0; letter-spacing: .34em; transform: translateY(14px); }
  }

  .rule {
    height: 3px;
    background: var(--yellow);
    margin: 30px auto 0;
    animation-name: rule;
    animation-delay: var(--t);
  }
  @keyframes rule {
    0%   { width: 0; opacity: 0; }
    22%  { width: 168px; opacity: 1; }
    82%  { width: 168px; opacity: 1; }
    100% { width: 0; opacity: 0; }
  }

  .kicker {
    margin-top: 26px;
    font-weight: 400;
    font-size: 19px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--muted);
    animation-name: fade;
    animation-delay: calc(var(--t) + .3s);
  }
  @keyframes fade {
    0%   { opacity: 0; transform: translateY(10px); }
    20%  { opacity: 1; transform: translateY(0); }
    80%  { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(10px); }
  }

  /* ---- the four surfaces, rising vertically ---- */
  .cards {
    position: absolute;
    left: 50%;
    bottom: 74px;
    translate: -50% 0;
    display: flex;
    gap: 18px;
    z-index: 2;
  }

  .card {
    width: 214px;
    padding: 20px 22px 22px;
    text-align: left;
    background: var(--charcoal-600);
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 3px;
    animation-name: rise;
  }
  .card:nth-child(1) { animation-delay: calc(var(--t) + .10s); }
  .card:nth-child(2) { animation-delay: calc(var(--t) + .22s); }
  .card:nth-child(3) { animation-delay: calc(var(--t) + .34s); }
  .card:nth-child(4) { animation-delay: calc(var(--t) + .46s); }
  @keyframes rise {
    0%   { opacity: 0; transform: translateY(26px); }
    24%  { opacity: 1; transform: translateY(0); }
    78%  { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(26px); }
  }

  .card b {
    display: block;
    font-weight: 600;
    font-size: 16px;
    color: var(--white);
    margin-bottom: 5px;
  }
  .card i {
    display: block;
    font-style: normal;
    font-weight: 400;
    font-size: 13px;
    color: var(--muted);
  }
  .card u {
    display: block;
    width: 26px; height: 2px;
    background: var(--yellow);
    margin-bottom: 14px;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="field a"></div>
  <div class="bloom a"></div>

  <div class="stage">
    <p class="word a">PI<span>X</span>ORA</p>
    <div class="rule a"></div>
    <p class="kicker a">Creative Digital Partner</p>
  </div>

  <div class="cards">
    <div class="card a"><u></u><b>Branding</b><i>Identity and design system</i></div>
    <div class="card a"><u></u><b>Websites</b><i>Built for the phone first</i></div>
    <div class="card a"><u></u><b>Social</b><i>Content with a calendar</i></div>
    <div class="card a"><u></u><b>Marketing</b><i>Ads that report back</i></div>
  </div>

<script>
  /* The only entry point the renderer uses. `p` is 0..1 through the loop;
     one negative delay seeks every animation to the same instant. */
  window.__seek = (p) => {
    const loop = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--loop'));
    document.documentElement.style.setProperty('--t', `${-(p * loop).toFixed(4)}s`);
    return document.fonts.ready;
  };
</script>
</body>
</html>
